name: Release

# Push a tag like v0.1.0 to build Linux binaries and publish a GitHub release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/renka-linux-$arch ./cmd/renka
          done
          cd dist && sha256sum renka-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/renka-linux-amd64
            dist/renka-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
